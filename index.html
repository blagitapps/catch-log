<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catch Log">
<title>Harvey's Catch Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a href="#list" class="brand"><img src="icons/icon-192.png" alt=""><span id="appName">Harvey's Catch Log</span></a>
  <span class="hdright"><span id="netState" class="net" hidden>Offline</span><span class="hdcow" id="hdcow"></span></span>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Main">
  <a href="#list" data-tab="list"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 7-5 10-5 3 0 5 2 6 5-1 3-3 5-6 5-3 0-7-1-10-5zm16 0 3-3v6z"/></svg>Catches</a>
  <a href="#map" data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Map</a>
  <a href="#add" data-tab="add" class="log"><span>+</span>Log catch</a>
  <a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg>Stats</a>
  <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>Settings</a>
</nav>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="row end"><button class="btn ghost" id="modalNo">Cancel</button><button class="btn danger" id="modalYes">OK</button></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
